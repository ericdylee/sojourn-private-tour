<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../assets/reel.css">
<style>
  body { margin: 0; }
  /* reel.css makes .type a positioning context (position: relative, for its
   * z-index). Left alone, .sub's "bottom" below would resolve against .type's
   * edge, not the frame's, and never enter the unsafe band. Neutralize it so
   * .sub's containing block is .reel-scene itself, matching what "380px from
   * the bottom" means below. */
  .reel-scene .type { position: static; }
  /* Deliberately broken: this sits inside the bottom 400px band. */
  .reel-scene .sub { position: absolute; left: 72px; bottom: 380px; }
</style>
<section class="reel-scene" style="--crop: 50% 50%">
  <div class="scrim"></div>
  <div class="type">
    <h1 class="display">Two words</h1>
    <p class="sub">Book a private day</p>
  </div>
</section>
