<!-- The SAME file as scenes-ok.html, spelled awkwardly: a `./` segment, a
     redundant `dir/..` round trip, a doubled slash and a percent-escaped dot.

     A check that failed here would be worse than no check — the first false
     alarm is the day someone learns to render past this one. -->
<section class="reel-scene" style="--crop: 50% 45%; --dur: 3000ms">
  <div class="photo photo-bg m-kenburns">
    <img src="../../../../../../assets//photos/./place/concept/../gamcheon-sky-vista%2Ejpg"
         data-photo="place/gamcheon-sky-vista.jpg" data-slot="place" alt="">
  </div>
  <div class="scrim"></div>
  <p class="photo-credit">Photo: VaneTrz20 / Wikimedia · CC0</p>
  <div class="type">
    <h1 class="display m-type-in">A village that <span class="accent">climbs</span></h1>
    <p class="sub m-type-in delay-1">Gamcheon Culture Village, Busan</p>
  </div>
</section>
