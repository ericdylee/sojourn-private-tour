<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../assets/reel.css">
<style> body { margin: 0; background: #222; } </style>

<!-- scenes-ok.html with ONE character class changed: data-photo still names the
     file the plan names, and src fetches an orphaned CC BY-SA 2.0 row instead.
     This is the shape the final review reproduced end to end — 발행 가능, zero
     issues, a publishable reel.mp4 of a ShareAlike photograph under a credit
     line naming the wrong photographer. data-photo is bookkeeping; src is the
     pixels. -->
<section class="reel-scene" style="--crop: 50% 45%; --dur: 3000ms">
  <div class="photo photo-bg m-kenburns">
    <img src="../../../../../../assets/photos/place/gamcheon-hero-src.jpg"
         data-photo="place/gamcheon-sky-vista.jpg" data-slot="place" alt="">
  </div>
  <div class="scrim"></div>
  <p class="photo-credit">Photo: VaneTrz20 / Wikimedia · CC0</p>
  <div class="type">
    <h1 class="display m-type-in">A village that <span class="accent">climbs</span></h1>
    <p class="sub m-type-in delay-1">Gamcheon Culture Village, Busan</p>
  </div>
</section>
